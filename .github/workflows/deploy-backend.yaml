name: CI/CD LibroVerse Backend

# 1. Ejecutar al hacer push a la rama 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  # TRABAJO 1: Compilar y subir imagen a Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/libroverse-backend:latest

  # TRABAJO 2: Desplegar en Google Cloud (Solo si el Trabajo 1 termina bien)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar servidor
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            # Ir a la carpeta del proyecto
            cd /home/${{ secrets.SSH_USER }}/libroverse
            
            # Descargar la imagen nueva que GitHub acaba de subir a Docker Hub
            docker-compose pull backend-api
            
            # Reiniciar SOLO el backend (sin apagar la base de datos ni Caddy)
            docker-compose up -d --no-deps backend-api
            
            # Limpieza: Borrar imágenes viejas de Docker para que no se llene el disco de la VM
            docker image prune -f
